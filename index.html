<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VK Clicker Fix</title>
    <!-- Загружаем библиотеку ВК -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #4a76a8, #2c4f7c);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #score-container {
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        #coin {
            width: 160px;
            height: 160px;
            background: #ffd700;
            border-radius: 50%;
            border: 8px solid #daa520;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 65px;
            user-select: none;
            transition: transform 0.05s;
        }
        #coin:active { transform: scale(0.93); }
        .btn {
            margin-top: 15px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            width: 220px;
        }
        #ad-button { background-color: #4bb34b; }
        #leaderboard-button { background-color: #ff9200; }
    </style>
</head>
<body>

    <div id="score-container">Монеты: <span id="score">0</span></div>
    <div id="coin">💰</div>
    <button id="ad-button" class="btn">+100 за рекламу</button>
    <button id="leaderboard-button" class="btn">🏆 Таблица лидеров</button>

    <script>
        // ЖЕСТКИЙ СИГНАЛ ДЛЯ ВК: Сразу же убираем синий экран загрузки платформы
        if (window.vkBridge) {
            vkBridge.send('VKWebAppInit')
                .then(() => {
                    console.log("Экран загрузки ВК успешно пробит!");
                    loadScore();
                })
                .catch(e => console.log("Ошибка инициализации", e));
        }

        let score = 0;
        const scoreEl = document.getElementById('score');
        const coinEl = document.getElementById('coin');
        const adButton = document.getElementById('ad-button');
        const leadButton = document.getElementById('leaderboard-button');

        // Логика клика по монете
        coinEl.addEventListener('click', () => {
            score++;
            scoreEl.textContent = score;
            saveScore();
            if (window.vkBridge) {
                vkBridge.send("VKWebAppTapticImpactOccurred", {"style": "light"}).catch(e => {});
            }
        });

        // Просмотр рекламы
        adButton.addEventListener('click', () => {
            if (!window.vkBridge) {
                score += 100;
                scoreEl.textContent = score;
                return;
            }
            vkBridge.send("VKWebAppShowRewardedVideo", {})
                .then(data => {
                    if (data && data.result) {
                        score += 100;
                        scoreEl.textContent = score;
                    }
                })
                .catch(() => {
                    score += 100; // Начисляем тестовый бонус, если реклама заблокирована
                    scoreEl.textContent = score;
                });
        });

        // Таблица лидеров
        leadButton.addEventListener('click', () => {
            if (window.vkBridge) {
                vkBridge.send("VKWebAppShowLeaderBoardBox", { "user_result": score }).catch(() => {});
            }
        });

        function saveScore() {
            if (window.vkBridge) {
                vkBridge.send("VKWebAppStorageSet", { "key": "coins_final", "value": score.toString() }).catch(e => {});
            }
        }

        function loadScore() {
            if (window.vkBridge) {
                vkBridge.send("VKWebAppStorageGet", { "keys": ["coins_final"] })
                .then(data => {
                    if (data && data.keys && data.keys[0] && data.keys[0].value) {
                        score = parseInt(data.keys[0].value, 10) || 0;
                        scoreEl.textContent = score;
                    }
                }).catch(e => {});
            }
        }
    </script>
</body>
</html>
