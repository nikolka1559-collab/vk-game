<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Битва цитат</title>

  <!-- VK UI стили (чтобы выглядело как родное приложение ВК) -->
  <link rel="stylesheet" href="https://unpkg.com" />

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, Roboto, "Segoe UI", sans-serif;
      background-color: #fff;
      margin: 0;
      padding: 0;
    }
    .app-container {
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
    }
    .quote-box {
      background: #f5f5f7;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }
    .quote-text {
      font-size: 18px;
      font-weight: 500;
      color: #222;
      line-height: 1.4;
      margin: 0;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 400px) {
      .options-grid { grid-template-columns: 1fr; }
    }
    .option-btn {
      padding: 14px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      background: #fff;
      border: 1px solid #e0e0e0;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }
    .option-btn:active {
      opacity: 0.8;
    }
    .progress-bar {
      margin-top: 20px;
      font-size: 15px;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="root" class="app-container"></div>

  <!-- 1. ПОДКЛЮЧЕНИЕ СОВРЕМЕННОЙ ВЕРСИИ VK BRIDGE -->
  <!-- Скрипт должен загружаться строго ДО кода эмуляции -->
  <script src="https://unpkg.com"></script>

  <!-- 2. ЭМУЛЯЦИЯ vkBridge ДЛЯ РАЗРАБОТКИ ВНЕ ВК -->
  <!-- Сработает только на локальном компьютере, внутри ВК этот блок проигнорируется -->
  <script>
    if (typeof vkBridge === 'undefined' || !vkBridge.send) {
      window.vkBridge = {
        send: function(method, params) {
          console.log('[VK Bridge Emulation] send:', method, params);
          if (method === 'VKWebAppClose') {
            alert('Приложение должно закрыться (эмуляция).');
          }
          // Возвращаем успешный Promise, чтобы скрипты игры не ломались
          return Promise.resolve({ result: true });
        },
        sendPromise: function(method, params) {
          return Promise.resolve({ result: true });
        },
        subscribe: function() {},
        unsubscribe: function() {}
      };
    }
  </script>

  <!-- 3. ИГРА -->
  <!-- Этот файл теперь получит настоящий vkBridge внутри экосистемы ВК -->
  <script src="./game.js"></script>
</body>
</html>
