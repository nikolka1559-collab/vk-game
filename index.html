<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Битва цитат</title>

    <!-- Стили VKUI -->
    <link rel="stylesheet" href="./vkui.css" />

    <!-- VK Bridge: официальная CDN-ссылка (гарантированно правильная версия) -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .status-text {
        text-align: center;
        line-height: 1.5;
      }
      .loading { color: #888; }
      .success { color: #0077FF; font-weight: bold; }
      .error { color: #FF4444; font-weight: bold; }
    </style>
  </head>
  <body>
    <div id="root">
      <p class="status-text loading">⏳ Инициализация VK Bridge…</p>
    </div>

    <!-- Твой код игры -->
    <script src="./game.js"></script>
  </body>
</html>
