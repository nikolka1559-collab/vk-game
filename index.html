<script>
    const GROUP_ID = 54697683; 

    const db = {
        work: [
            "Работа не волк, работа — это я, и я хочу спать. 💻",
            "Мой рабочий день: до обеда хочется есть, после обеда — спать. 🥪",
            "Удаленная работа — это когда ты работаешь там же, где спишь. 🛋️"
        ],
        life: [
            "В активном поиске... пульта от телевизора. 📺",
            "Мои планы на день: Срочно отменить взрослую жизнь. 🦥",
            "Ем, сплю и жду, когда наступит пятница. 😁"
        ],
        philosophy: [
            "Мудрость приходит с возрастом, но иногда возраст приходит один. 🦉",
            "Я не ленивый, я в энергосберегающем режиме. 🔋",
            "Всё идёт хорошо, но мимо. 🌌"
        ]
    };

    let currentStatus = "";
    let isSubscribed = false;
    let myVkName = "Вы";
    let userExp = parseInt(localStorage.getItem('status_app_global_exp')) || 0;
    let userLevel = parseInt(localStorage.getItem('status_app_level')) || 1;

    function safeGetElement(id) {
        const el = document.getElementById(id);
        if (!el) console.warn(`Элемент #${id} не найден!`);
        return el;
    }

    function initApp() {
        if (typeof vkBridge === 'undefined') {
            console.warn("VK Bridge не обнаружен (запуск вне ВК)");
            fallbackInit();
            return;
        }

        vkBridge.send("VKWebAppInit")
            .then(() => {
                console.log("VK Bridge успешно инициализирован");
                getUserVkData();
                checkGroupSubscription();
                loadLeaderboard();
            })
            .catch(err => {
                console.error("Ошибка инициализации Bridge:", err);
                fallbackInit();
            });
    }

    function fallbackInit() {
        const userNameEl = safeGetElement("userName");
        const leaderboardEl = safeGetElement("leaderboardList");
        if (userNameEl) userNameEl.innerText = "Тестовый Игрок";
        if (leaderboardEl) leaderboardEl.innerHTML = '<div style="text-align:center; color:orange; font-size:12px;">Запущено вне ВК (демо-режим)</div>';
        updateStatsUI();
    }

    function getUserVkData() {
        vkBridge.send("VKWebAppGetUserInfo")
            .then(data => {
                if (data.first_name) {
                    myVkName = `${data.first_name} ${data.last_name || ''}`.trim();
                    const el = safeGetElement("userName");
                    if (el) el.innerText = data.first_name;
                    updateStatsUI();
                    saveMyScore(); 
                }
            })
            .catch(() => {
                const el = safeGetElement("userName");
                if (el) el.innerText = "Игрок";
            });
    }

    function checkGroupSubscription() {
        vkBridge.send("VKWebAppGetGroupToken", { "group_id": GROUP_ID, "scope": "groups" })
            .then(() => { isSubscribed = true; })
            .catch(() => {});
    }

    async function requestSubscription() {
      try {
        await vkBridge.send("VKWebAppJoinGroup", {"group_id": GROUP_ID});
        isSubscribed = true;
        return true;
      } catch (e) {
        alert("Для генерации нужно подписаться на группу!");
        return false;
      }
    }

    function updateStatsUI() {
        const elLevel = safeGetElement("userLevel");
        const elExp = safeGetElement("userExp");
        if (elLevel) elLevel.innerText = userLevel;
        if (elExp) elExp.innerText = userExp;
    }

    function addExperience(amount) {
        userExp += amount;
        if (userExp >= 100) {
            userLevel += 1;
            userExp = userExp - 100;
            alert(`🎉 Новый уровень! Вы достигли ${userLevel} уровня!`);
        }
        localStorage.setItem('status_app_global_exp', userExp);
        localStorage.setItem('status_app_level', userLevel);
        updateStatsUI();
        if (typeof vkBridge !== 'undefined') saveMyScore();
    }

    function claimDailyBonus() {
        const lastBonus = localStorage.getItem('status_app_bonus_time');
        const now = new Date().getTime();
        if (lastBonus && (now - lastBonus < 86400000)) {
            alert("Бонус уже получен! Возвращайтесь завтра.");
            return;
        }
        localStorage.setItem('status_app_bonus_time', now);
        addExperience(30);
        const btn = safeGetElement("bonusBtn");
        if (btn) btn.style.display = "none";
    }

    function saveMyScore() {
        const totalScore = (userLevel * 100) + userExp;
        
        vkBridge.send("VKWebAppStorageGet", {"keys": ["global_leaderboard"]})
            .then(data => {
                let list = [];
                if(data.keys && data.keys[0] && data.keys[0].value) {
                    try {
                        list = JSON.parse(data.keys[0].value);
                    } catch (e) {
                        console.error("Не удалось распарсить лидерборд:", e);
                        list = [];
                    }
                }
                
                list = list.filter(item => item.name !== myVkName);
                list.push({ name: myVkName, score: totalScore });
                list.sort((a, b) => b.score - a.score);
                list = list.slice(0, 5);
                
                vkBridge.send("VKWebAppStorageSet", {
                    "key": "global_leaderboard",
                    "value": JSON.stringify(list)
                })
                .then(() => loadLeaderboard())
                .catch(err => console.error(err));
            })
            .catch(err => console.error("Не удалось получить лидерборд для сохранения", err));
    }

    function loadLeaderboard() {
        vkBridge.send("VKWebAppStorageGet", {"keys": ["global_leaderboard"]})
            .then(data => {
                const container = safeGetElement("leaderboardList");
                if (!container) return;
                container.innerHTML = "";
                let list = [];
                if(data.keys && data.keys[0] && data.keys[0].value) {
                    try {
                        list = JSON.parse(data.keys[0].value);
                    } catch (e) {
                        console.error("Не удалось распарсить сохранённый лидерборд:", e);
                        list = [];
                    }
                }

                if(list.length === 0) {
                    container.innerHTML = 'Вы будете первым в списке!';
                    return;
                }

                const medals = ["🥇", "🥈", "🥉", "👤", "👤"];
                list.forEach((player, index) => {
                    const item = document.createElement("div");
                    item.className = "leader-item";
                    const place = medals[index] || "👤";
                    // Важно: шаблон в обратных кавычках
                    item.innerHTML = `<div><span class="place">${place}</span> ${player.name}</div>
                                      <div class="exp-badge">${player.score} XP</div>`;
                    container.appendChild(item);
                });
            })
            .catch(() => {
                const container = safeGetElement("leaderboardList");
                if (container) container.innerHTML = 'Не удалось загрузить топ.';
            });
    }

    async function generateStatus() {
        if (typeof vkBridge !== 'undefined' && !isSubscribed) {
            const sub = await requestSubscription();
            if (!sub) return;
        }

        const selectEl = safeGetElement("categorySelect");
        if (!selectEl) return;

        const category = selectEl.value;
        const statuses = db[category];
        if (!statuses || statuses.length === 0) return;

        currentStatus = statuses[Math.floor(Math.random() * statuses.length)];
        const cardEl = safeGetElement("statusCard");
        if (cardEl) cardEl.innerText = currentStatus;
        addExperience(5);
    }

    function setStatusVK() {
        if (!currentStatus) return alert("Сначала сгенерируйте статус!");
        if (typeof vkBridge === 'undefined') return alert("Изменение статуса доступно только внутри приложения ВК!");

        vkBridge.send("VKWebAppSetLocation", {"location": currentStatus})
            .then(() => { 
                alert("Статус обновлен!"); 
                addExperience(15); 
            })
            .catch(() => alert("Ошибка изменения статуса."));
    }

    function shareToStory() {
        if (!currentStatus) return alert("Сначала сгенерируйте статус!");
        if (typeof vkBridge === 'undefined') return alert("Публикация историй доступна только внутри ВК!");

        vkBridge.send("VKWebAppShowStoryBox", {
            "background_type": "gradient", 
            "gradient_color": "blue",
            "stickers": [
                {
                    "type": "text", 
                    "text": currentStatus, 
                    "style": "transparent_background", 
                    "alignment": "center", 
                    "font_size": 24
                }
            ]
        })
        .then(() => addExperience(20))
        .catch(err => console.error(err));
    }

    // Запускаем только после загрузки DOM
    document.addEventListener('DOMContentLoaded', () => {
        initApp();
    });
</script>
