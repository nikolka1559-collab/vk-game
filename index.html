<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VK Clicker Stable</title>
    <!-- Официальный скрипт VK Bridge -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #4a76a8, #2c4f7c);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #score-container {
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        #coin {
            width: 160px;
            height: 160px;
            background: #ffd700;
            border-radius: 50%;
            border: 8px solid #daa520;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 65px;
            user-select: none;
            transition: transform 0.05s;
        }
        #coin:active { transform: scale(0.93); }
        .btn {
            margin-top: 15px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            width: 220px;
        }
        #ad-button { background-color: #4bb34b; }
        #leaderboard-button { background-color: #ff9200; }
    </style>
</head>
<body>

    <div id="score-container">Монеты: <span id="score">0</span></div>
    <div id="coin">💰</div>
    <button id="ad-button" class="btn">+100 (Тест-Бонус)</button>
    <button id="leaderboard-button" class="btn">🏆 Таблица лидеров</button>

    <script>
        // Поиск библиотеки во всех возможных глобальных переменных
        const bridge = window.vkBridge || window.vkbridge || (window.vk && window.vk.bridge);

        let score = 0;
        const scoreEl = document.getElementById('score');
        const coinEl = document.getElementById('coin');
        const adButton = document.getElementById('ad-button');
        const leadButton = document.getElementById('leaderboard-button');

        // Безопасный запуск без блокировки загрузки страницы
        if (bridge && typeof bridge.send === 'function') {
            bridge.send("VKWebAppInit", {})
                .then(() => {
                    console.log("VK Bridge подключен");
                    loadScore();
                })
                .catch(err => console.log("ВК отклонил инициализацию, работаем локально", err));
        } else {
            console.log("Запущено вне ВКонтакте или блокировщик вырезал Bridge");
        }

        // Логика клика
        coinEl.addEventListener('click', () => {
            score++;
            scoreEl.textContent = score;
            saveScore();
            if (bridge) bridge.send("VKWebAppTapticImpactOccurred", {"style": "light"}).catch(e => {});
        });

        // БЕЗОПАСНАЯ КНОПКА: Сначала просто выдает монеты, чтобы обойти AdBlock при тестах
        adButton.addEventListener('click', () => {
            if (!bridge) {
                // Если мы тестируем в обычном браузере без ВК
                score += 100;
                scoreEl.textContent = score;
                alert("Локальный тест: +100 монет!");
                return;
            }

            // Пытаемся вызвать ВК-рекламу, но если AdBlock её режет, игра НЕ упадет
            bridge.send("VKWebAppShowRewardedVideo", {})
                .then(data => {
                    if (data && data.result) {
                        score += 100;
                        scoreEl.textContent = score;
                    }
                })
                .catch(err => {
                    console.log("Реклама заблокирована AdBlock-ом, начисляем тестовый бонус");
                    score += 100;
                    scoreEl.textContent = score;
                    alert("Тестовый режим: Реклама в ВК недоступна, но +100 монет начислено!");
                });
        });

        // Лидерборд
        leadButton.addEventListener('click', () => {
            if (bridge) {
                bridge.send("VKWebAppShowLeaderBoardBox", { "user_result": score })
                .catch(() => alert("Таблица лидеров откроется после публикации игры"));
            } else {
                alert("Лидерборд доступен только внутри ВКонтакте");
            }
        });

        function saveScore() {
            if (bridge) {
                bridge.send("VKWebAppStorageSet", { "key": "coins", "value": score.toString() }).catch(e => {});
            }
        }

        function loadScore() {
            if (bridge) {
                bridge.send("VKWebAppStorageGet", { "keys": ["coins"] })
                .then(data => {
                    if (data && data.keys && data.keys[0] && data.keys[0].value) {
                        score = parseInt(data.keys[0].value, 10) || 0;
                        scoreEl.textContent = score;
                    }
                }).catch(e => {});
            }
        }
    </script>
</body>
</html>
